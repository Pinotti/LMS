volumes:
  database:
  redis_data:
  mailpit_data:

networks:
  network:
    driver: bridge
    name: custom_network

services:
  laravel:
    build:
      context: .
      dockerfile: ./php/Dockerfile
    image: laravel:latest
    container_name: laravel
    hostname: laravel
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ../:/var/www:rw
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    working_dir: /var/www
    ports:
      - "127.0.0.1:9080:80"

    depends_on:
      - mysql
      - redis
      - mailpit
    networks:
      - network

  mysql:
    image: mysql:latest
    container_name: mysql
    hostname: mysql
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lms
      MYSQL_USER: admin
      MYSQL_PASSWORD: "#0526@Abril.,"
    volumes:
      - database:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - network
  
  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass curs0s --appendonly yes
    networks:
      - network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    environment:
      - TZ=UTC
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
